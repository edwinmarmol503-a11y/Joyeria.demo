<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página no encontrada — NOCTURNE</title>
<meta name="robots" content="noindex">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♦</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
  /* ---------- Error page (404 / lost piece) ---------- */
  .error-page {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 12vh 6vw;
    background: radial-gradient(ellipse at 50% 30%, var(--black-2) 0%, var(--black-deep) 70%);
    position: relative; overflow: hidden;
  }
  .error-nav {
    position: absolute; top: 0; left: 0; right: 0; padding: 34px clamp(24px, 3.5vw, 56px);
  }
  .error-nav a { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: 0.14em; color: var(--white); }
  .error-nav a:hover { color: var(--gold-2); }

  .error-jewel { width: min(38vw, 220px); margin-bottom: 34px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6)); opacity: 0.85; }
  .error-code {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(4rem, 12vw, 9rem); line-height: 1;
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, var(--gold-soft) 0%, var(--gold-2) 45%, #7a611c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  .error-eyebrow { font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-2); margin-bottom: 22px; }
  .error-title { font-size: clamp(1.4rem, 3vw, 2.1rem); color: var(--silver-2); margin-bottom: 14px; max-width: 640px; }
  .error-sub { font-family: var(--font-display); font-style: italic; color: var(--text-muted); font-size: 1.05rem; max-width: 520px; margin-bottom: 40px; }
  .error-actions { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  .error-crack {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: var(--silver-2); box-shadow: 0 0 8px 2px rgba(255,255,255,0.7);
    animation: twinkle 2.6s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .error-jewel, .error-crack { animation: none !important; }
  }
</style>
</head>
<body>

<div class="grain-overlay" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<nav class="error-nav">
  <a href="./">NOCTURNE</a>
</nav>

<main class="error-page">
  <svg class="error-jewel" viewBox="0 0 400 400" role="img" aria-label="Gema con una fractura, ilustración">
    <defs>
      <radialGradient id="goldGradErr" cx="42%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FCEFC0"/>
        <stop offset="35%" stop-color="#D4AF37"/>
        <stop offset="70%" stop-color="#9c7a1f"/>
        <stop offset="100%" stop-color="#3d2f0c"/>
      </radialGradient>
      <radialGradient id="gemGradErr" cx="38%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="30%" stop-color="#E5E5E5"/>
        <stop offset="65%" stop-color="#8f9296"/>
        <stop offset="100%" stop-color="#2a2b2d"/>
      </radialGradient>
      <filter id="softBlurErr"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <ellipse cx="200" cy="330" rx="130" ry="18" fill="#000" opacity="0.55" filter="url(#softBlurErr)"/>
    <path d="M120 210 A80 80 0 1 0 280 210" fill="none" stroke="url(#goldGradErr)" stroke-width="26"/>
    <polygon points="200,90 250,140 230,240 170,240 150,140" fill="url(#gemGradErr)"/>
    <polygon points="200,90 250,140 200,160 150,140" fill="#ffffff" opacity="0.55"/>
    <polygon points="170,240 230,240 200,270" fill="#5a5c5f" opacity="0.7"/>
    <!-- fracture line -->
    <path d="M195 105 L215 150 L188 175 L222 210 L200 240" fill="none" stroke="#050505" stroke-width="3" opacity="0.85"/>
  </svg>
  <div class="error-crack" style="top: 30%; left: 40%;"></div>
  <div class="error-crack" style="top: 45%; left: 62%; animation-delay: .8s;"></div>

  <p class="error-eyebrow">Pieza Extraviada</p>
  <h1 class="error-code">404</h1>
  <h2 class="error-title">Esta pieza no forma parte de nuestra colección.</h2>
  <p class="error-sub">El enlace que seguiste se perdió en la oscuridad. Vuelve a la vitrina principal y sigue explorando.</p>

  <div class="error-actions">
    <a href="./" class="btn btn-gold">Volver al Inicio</a>
    <a href="./#productos" class="btn btn-line">Ver Colección</a>
  </div>
</main>

</body>
</html>
